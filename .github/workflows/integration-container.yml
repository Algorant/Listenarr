name: Integration Container

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches:
      - integration/deluge-plus-transmission
    paths-ignore:
      - '**/*.md'

concurrency:
  group: integration-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=7 HEAD)"
          image="ghcr.io/algorant/listenarr"
          {
            echo "short_sha=${short_sha}"
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:deluge-transmission-canary"
            echo "${image}:deluge-transmission-${short_sha}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push integration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/Algorant/Listenarr
            org.opencontainers.image.description=Listenarr Deluge/Transmission seedbox integration test image
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          tags: ${{ steps.meta.outputs.tags }}

      - name: Print image tags
        shell: bash
        run: |
          cat <<'EOF'
          Published tags:
          ${{ steps.meta.outputs.tags }}
          EOF
